<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AtoB Remote</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style1.css') }}">
</head>
<body>
    <div id="mobile-web">
        <!-- Navigation -->
        <nav>
            <div id="nav-remote" class="nav-tab active" onclick="switchTab('remote')">Remote</div>
            <div id="nav-log" class="nav-tab" onclick="switchTab('log')">Logs</div>
        </nav>

        <!-- Remote Page -->
        <div id="page-remote" class="page-content">
            
            <!-- Status Bar -->
            <div class="status-card">
                <div class="status-item">
                    <span class="label">Status:</span>
                    <span id="status-flag" class="badge">Disconnected</span>
                </div>
                <div class="status-item">
                    <span class="label">Mute:</span>
                    <span id="mute-flag" class="badge badge-secondary">-</span>
                </div>
            </div>

            <!-- Text Display -->
            <div class="section">
                <label class="section-title">Current Text</label>
                <div id="text-display" class="display-box">
                    No text to display currently
                </div>
            </div>
            
            <!-- Braille Display -->
            <div id="braille-display" class="card">
                <div class="braille-row">
                    <span class="label">Letter:</span>
                    <span id="letter-display" class="highlight">-</span>
                </div>        
                <div class="braille-row">
                    <span class="label">Braille:</span>
                    <span id="dot-display" class="highlight">000,000</span>
                </div> 
            </div>

            <!-- Controls -->
            <div id="button" class="button-group">
                <button id="clear-btn" class="btn btn-secondary">Clear All</button>
                <button id="reboot-btn" class="btn btn-danger">Reboot Machine</button>
            </div>

            <!-- Text Input -->
            <div class="input-section">
                <label class="section-title">Input text here</label>
                <div class="input-row">
                    <input type="text" id="text-input" placeholder="Type something...">
                    <button id="submit-btn" class="btn btn-primary">Submit</button>
                </div>
            </div>

        <!-- Speed Semicircle Dial -->
        <div class="slider-section">
            <div class="slider-header">
                <label>Reading Speed</label>
                <span id="speed-display" class="badge badge-accent">2.0</span>
            </div>
            
            <!-- Semicircle Dial Container -->
            <div class="dial-container" id="dial-container">
                <svg viewBox="0 0 200 120" id="speed-dial">
                    <!-- Background Arc -->
                    <path d="M 20 100 A 80 80 0 0 1 180 100" class="dial-track" />
                    <!-- Active Fill Arc -->
                    <path d="M 20 100 A 80 80 0 0 1 180 100" class="dial-fill" id="dial-fill" />
                    <!-- Ticks generated via JS -->
                    <g id="dial-ticks"></g>
                    <!-- Central Text -->
                    <text x="100" y="85" class="dial-text" id="dial-text-value">2.0x</text>
                    <!-- Indicator / Knob -->
                    <polygon points="15,100 25,100 20,88" class="dial-knob" id="dial-knob" />
                </svg>
                <!-- Hidden input to keep compatibility with your existing script1.js -->
                <input type="hidden" id="speed-slider" value="2.0">
            </div>
        </div>
        <!-- Log Page -->
        <div id="page-log" class="page-content" style="display: none">
            <h2 class="section-title">System Logs</h2>
            <div class="display-box log-box">
                <!-- Logs will populate here -->
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='script1.js') }}"></script>
</body>
</html>

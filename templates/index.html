<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Braille Remote & Logs</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='atob.png') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="style.css  ">
</head>
<body>
    <main class="app-container">
        
        <nav class="navbar">
            <div id="nav-remote" class="nav-link active" onclick="switchTab('remote')">Remote</div>
            <div id="nav-log" class="nav-link" onclick="switchTab('log')">Logs</div>
        </nav>

        <div id="view-remote" class="view-section">
            <div class="middle-content">
                <div class="status-container">
                    <span class="mic-status">Mic: Active</span>
                    <span>Status: <span class="status-text">Disconnected</span></span>
                </div>

                <div class="section-label">Live Transcription</div>
                <section class="log-area live-text-container" id="live-text-display">
                    <span style="color: var(--text-secondary); font-size: 14px;">Waiting for mic input...</span>
                </section>

                <div class="controls-row">
                    <nav class="btn-cluster">
                        <button class="action-btn" onclick="sendCommand('_seq_')">
                            <span class="icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>Sequence
                        </button>
                        <button class="action-btn" onclick="sendCommand('_clear_')">
                            <span class="icon"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></span>Clear
                        </button>
                        <button class="action-btn" onclick="sendCommand('_reboot_')">
                            <span class="icon"><svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg></span>Reboot
                        </button>
                    </nav>

                    <div class="arc-container" id="arcContainer">
                        <svg viewBox="-30 0 170 300" preserveAspectRatio="xMidYMid meet" style="pointer-events: none;">
                            <g id="ticks"></g>
                            <text x="40" y="140" font-size="9" fill="#777">BRAILLE</text>
                            <text x="40" y="152" font-size="9" fill="#777">OUTPUT SPEED</text>
                            <circle cx="10" cy="150" r="22" fill="#0a0a0a" stroke="#888" stroke-width="2"/>
                            <text x="10" y="153" text-anchor="middle" font-size="13" fill="white" font-weight="600">
                                <tspan id="speedValue">2.0</tspan><tspan font-size="8" fill="#888">s</tspan>
                            </text>
                            <text x="105" y="25" font-size="10" fill="#777">MAX</text>
                            <text x="105" y="285" font-size="10" fill="#777">MIN</text>
                        </svg>
                    </div>
                </div>
            </div>

            <footer class="input-footer">
                <div class="input-wrapper">
                    <input id="textInput" class="text-input" placeholder="Write a Message..." autocomplete="off">
                    <button class="inner-send-btn" onclick="sendText()">
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                    </button>
                </div>
            </footer>
        </div>

        <div id="view-log" class="view-section hidden">
            <div class="middle-content" style="padding-bottom: 0;">
                <div class="status-container">
                    <span class="mic-status">Mic: Active</span>
                    <span>Status: <span class="status-text">Disconnected</span></span>
                </div>
                
                <div class="section-label">System Output Logs</div>
                <section class="log-area terminal-container" id="terminal" style="flex: 1; min-height: 0;">
                    <div class="log-entry">System Ready...</div>
                    <div class="log-entry" style="color: var(--text-secondary);">Waiting for braille data...</div>
                </section>
            </div>

            <footer class="input-footer">
                <button class="action-btn" style="width: 100%; justify-content: center; height: 55px;" onclick="document.getElementById('terminal').innerHTML = '<div class=\'log-entry\' style=\'color: var(--text-secondary);\'>Logs cleared.</div>';">
                    <span class="icon"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></span> Clear Terminal Logs
                </button>
            </footer>
        </div>

        <div id="reboot-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <p class="modal-text">Do you want to confirm Reboot?</p>
                <div class="modal-actions">
                    <button class="action-btn modal-btn" onclick="confirmReboot()">
                        <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span> Confirm
                    </button>
                    <button class="action-btn modal-btn" onclick="cancelReboot()">
                        <span class="icon"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></span> Cancel
                    </button>
                </div>
            </div>
        </div>

    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
